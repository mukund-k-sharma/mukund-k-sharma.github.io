<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRAM Tetris: Running a 9B Coding Agent on a 6GB Laptop | Mukund K. Sharma</title>
    <meta name="description" content="A deep technical breakdown of running Qwen 3.5 9B with a 48K context window on a 6GB RTX 2060 laptop using TurboQuant cache compression and custom llama.cpp builds.">
    <meta name="author" content="Mukund K. Sharma">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #94a3b8;
            --text-light: #e2e8f0;
            --accent: #5eead4;
            --accent-dim: rgba(94, 234, 212, 0.1);
            --border: rgba(255, 255, 255, 0.08);
            --code-bg: #0d1117;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        .blog-header {
            border-bottom: 1px solid var(--border);
            padding: 24px 0;
        }

        .blog-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .blog-header a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }

        .blog-header a:hover { opacity: 0.8; }

        .blog-meta-line {
            color: var(--text-main);
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .blog-body { padding: 64px 0 96px; }

        /* Typography */
        .blog-body h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-light);
            line-height: 1.25;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .blog-body h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-light);
            margin-top: 48px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .blog-body h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-light);
            margin-top: 32px;
            margin-bottom: 12px;
        }

        .blog-body p {
            margin-bottom: 16px;
        }

        .blog-body strong {
            color: var(--text-light);
            font-weight: 600;
        }

        .blog-body a {
            color: var(--accent);
            text-decoration: none;
        }

        .blog-body a:hover {
            text-decoration: underline;
        }

        .blog-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 40px 0;
        }

        /* Lists */
        .blog-body ul, .blog-body ol {
            padding-left: 24px;
            margin-bottom: 16px;
        }

        .blog-body li {
            margin-bottom: 8px;
        }

        .blog-body li ul {
            margin-top: 8px;
            margin-bottom: 0;
        }

        /* Inline code */
        .blog-body code:not(pre code) {
            background: var(--accent-dim);
            color: var(--accent);
            padding: 2px 7px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            font-weight: 500;
        }

        /* Code blocks */
        .blog-body pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px 24px;
            overflow-x: auto;
            margin-bottom: 24px;
        }

        .blog-body pre code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-light);
        }

        /* Tables */
        .blog-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .blog-body thead th {
            background: var(--bg-card);
            color: var(--text-light);
            font-weight: 600;
            text-align: left;
            padding: 12px 16px;
            border-bottom: 2px solid var(--accent);
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        .blog-body tbody td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        .blog-body tbody tr:hover {
            background: rgba(30, 41, 59, 0.5);
        }

        /* Blockquote */
        .blog-body blockquote {
            border-left: 3px solid var(--accent);
            padding: 16px 20px;
            margin: 24px 0;
            background: var(--accent-dim);
            border-radius: 0 8px 8px 0;
        }

        .blog-body blockquote p {
            margin-bottom: 0;
        }

        /* Back to top */
        .blog-footer {
            border-top: 1px solid var(--border);
            padding: 32px 0;
            text-align: center;
        }

        .blog-footer a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .blog-body h1 { font-size: 1.75rem; }
            .blog-body h2 { font-size: 1.25rem; }
            .blog-body table { font-size: 0.8rem; }
            .blog-body thead th, .blog-body tbody td { padding: 8px 10px; }
            .blog-body pre { padding: 14px 16px; }
        }
    </style>
</head>
<body>

    <div class="blog-header">
        <div class="container">
            <a href="../index.html">← Mukund K. Sharma</a>
            <span class="blog-meta-line">May 18, 2026</span>
        </div>
    </div>

    <div class="blog-body">
        <div class="container">
            <div id="blog-content"></div>
        </div>
    </div>

    <div class="blog-footer">
        <div class="container">
            <a href="../index.html">← Back to Portfolio</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script>
        marked.setOptions({ breaks: false, gfm: true });

        fetch('qwen3.5-9B_model_local_LLM.md')
            .then(function(r) { return r.text(); })
            .then(function(md) {
                var content = md.replace(/^---[\s\S]*?---\s*/, '');
                document.getElementById('blog-content').innerHTML = marked.parse(content);
                hljs.highlightAll();
            })
            .catch(function(err) {
                document.getElementById('blog-content').innerHTML =
                    '<p style="color:#e2e8f0;">Failed to load blog content. <a href="https://github.com/mukund-k-sharma/mukund-k-sharma.github.io/blob/main/blogs/qwen3.5-9B_model_local_LLM.md">Read on GitHub instead.</a></p>';
            });
    </script>

</body>
</html>
